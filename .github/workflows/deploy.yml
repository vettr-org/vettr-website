name: Deploy to Namecheap

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.6.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAMECHEEP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to Namecheap
        run: |
          find out -type f -exec chmod 644 {} +
          find out -type d -exec chmod 755 {} +
          bash scripts/deploy.sh ~/.ssh/deploy_key ${{ secrets.NAMECHEEP_SSH_HOST }} ${{ secrets.NAMECHEEP_SSH_USER }} ${{ secrets.NAMECHEEP_DEPLOY_PATH }}
