name: Deploy to Namecheap

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.6.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Key written: $(head -1 ~/.ssh/deploy_key)"
          
          ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "Build files: $(ls out/ | head -20)"
          find out -type f -exec chmod 644 {} +
          find out -type d -exec chmod 755 {} +
          
          echo "Deploying to $SSH_USER@$SSH_HOST:$SSH_DEPLOY_PATH"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30" \
            out/ "${SSH_USER}@${SSH_HOST}:${SSH_DEPLOY_PATH}/"
          
          echo "Deploy complete!"
